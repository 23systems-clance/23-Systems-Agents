#         // for reply: subject, body, fromEmail, intent, draftStatus
#         // for step_execution: stepNumber, channel, status, template
#       }
#     ]
#   }

# ============================================================================
# Admin Campaign Export Endpoints (existing router: src/routes/admin/campaigns.ts)
# Base path: /api/v1/admin/campaigns
# Auth: Admin session
# ============================================================================

# POST /api/v1/admin/campaigns/:campaignId/personality/push-crm (NEW)
# Description: Push personality data to HubSpot for all enriched contacts in campaign
# Body: (empty)
# Response:
#   {
#     success: true,
#     total: number,
#     synced: number,
#     skipped: number,
#     failed: number,
#     errors: [{ contactId: string, error: string }]
#   }
# Side effects: Creates HubSpot custom properties (idempotent), writes contact values

# GET /api/v1/admin/campaigns/:campaignId/personality/export-csv (NEW)
# Description: Download personality data as CSV for all enriched contacts in campaign
# Response: text/csv (Content-Disposition: attachment)
# CSV columns: firstName, lastName, email, companyName, jobTitle, linkedinUrl,
#   archetype, disc_dominance, disc_influence, disc_steadiness, disc_calculativeness,
#   ocean_openness, ocean_conscientiousness, ocean_extraversion, ocean_agreeableness,
#   ocean_emotional_stability, communication_types, communication_adjectives,
#   what_to_say, what_to_avoid, key_traits_risk, key_traits_decision_drivers,
#   email_tone, email_length

# ============================================================================
# Slack Command (existing: src/listeners/commands/enrich.ts)
# ============================================================================

# /enrich personality <contactId|searchTerm> (NEW subcommand)
# Description: On-demand personality enrichment via Slack
# Input: Contact ID (UUID) or search term (name/email)
# Response:
#   - If contact found + LinkedIn URL present: enriches and posts confirmation
#     with archetype, communication style, and "View Contact Profile" button
#   - If contact found but no LinkedIn URL: ephemeral error
#   - If multiple matches: ephemeral list of matches for disambiguation
#   - If no match: ephemeral "Contact not found" message

# ============================================================================
# Slack Notifications (triggered by webhook, not an endpoint)
# ============================================================================

# Reply Notification (triggered after reply_received webhook)
# DM to each BDR in CampaignBdr:
#   - Reply preview (first 200 chars)
#   - Intent classification badge
#   - Personality archetype + communication style (if available)
#   - "View Contact Profile" button -> dashboard URL
#   - "Open UniBox" button -> UniBox filtered to this reply
#
# Channel post to campaign.slackChannelId:
#   - Same content as DM above
