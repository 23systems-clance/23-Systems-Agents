name: Deploy to ECS

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - '**.md'
      - 'specs/**'
      - 'reference/**'
      - '.specify/**'
      - 'admin-dashboard/**'

jobs:
  deploy-staging:
    name: Deploy to Staging
    if: github.ref == 'refs/heads/develop'
    uses: ./.github/workflows/deploy-ecs.yml
    with:
      environment: staging
      ecr-repo: staging-slack-list-processor
      ecs-cluster: staging-slack-list-processor
      ecs-service: staging-slack-list-processor
    secrets: inherit

  deploy-production:
    name: Deploy to Production
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/deploy-ecs.yml
    with:
      environment: production
      ecr-repo: prod-slack-list-processor
      ecs-cluster: prod-slack-list-processor
      ecs-service: prod-slack-list-processor
    secrets: inherit
